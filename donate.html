<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donate Food | Zero Waste Food</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">♻ Zero Waste Food</a></div></nav>
<main class="container py-4">
  <div class="form-card mx-auto">
    <h1 class="h3 mb-3">Add a food donation</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for message in messages %}<div class="alert alert-warning">{{ message }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="post">
      <label class="form-label">Donor name</label><input class="form-control mb-3" name="donor_name" required>
      <label class="form-label">Food item</label><input class="form-control mb-3" name="food_name" placeholder="e.g. Vegetable rice" required>
      <label class="form-label">Quantity</label><input class="form-control mb-3" name="quantity" placeholder="e.g. 20 meal boxes" required>
      <label class="form-label">Pickup location</label><input class="form-control mb-3" name="location" required>
      <label class="form-label">Contact number</label><input class="form-control mb-3" name="phone" type="tel" required>
      <label class="form-label">Use before / pickup deadline</label><input class="form-control mb-4" name="expiry_time" type="datetime-local" required>
      <button class="btn btn-success w-100">Submit donation</button>
      <a href="/" class="btn btn-link w-100 mt-2">Back to home</a>
    </form>
  </div>
</main>
</body>
</html>
